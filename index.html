<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File Admin</title>

<style id="css/style.css">
:root {
  --bg: #fafafa;
  --panel: #ffffff;
  --fg: #1a1a1a;
  --muted: #6b6b6b;
  --line: #dcdcdc;
  --danger: #a11;
  --ok: #2a7a2a;
}
* { box-sizing: border-box; }
body {
  font-family: "Courier New", Courier, monospace;
  background: var(--bg);
  color: var(--fg);
  margin: 0;
  padding: 32px 24px 180px;
  line-height: 1.6;
  max-width: 900px;
  margin-left: auto;
  margin-right: auto;
}
h1 {
  font-size: 1.1em;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  border-bottom: 3px double var(--fg);
  padding-bottom: 10px;
  margin: 0 0 28px;
}
section {
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 20px 22px;
  margin-bottom: 22px;
  box-shadow: 4px 4px 0 rgba(0,0,0,0.04);
}
section > h2 {
  font-size: 0.8em;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin: 0 0 16px;
  padding-bottom: 6px;
  border-bottom: 1px dashed var(--line);
}
button, label.btn {
  font-family: inherit;
  font-size: 0.88em;
  background: var(--panel);
  color: var(--fg);
  border: 1px solid var(--fg);
  padding: 8px 18px;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  display: inline-block;
}
button:hover, label.btn:hover { background: var(--fg); color: var(--bg); }
button:active { transform: translateY(1px); }
button.danger { border-color: var(--danger); color: var(--danger); }
button.danger:hover { background: var(--danger); color: #fff; }
input[type="file"] { display: none; }
input[type="text"], input[type="password"] {
  font-family: inherit;
  font-size: 0.9em;
  padding: 7px 10px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--fg);
  width: 240px;
}
input:focus { outline: 1px solid var(--fg); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.hint { font-size: 0.75em; color: var(--muted); margin-top: 12px; }
#preview { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
#preview:empty::before { content: "[ nessun file ]"; font-size: 0.75em; color: var(--muted); }
.thumb {
  position: relative;
  width: 140px;
  border: 1px solid var(--line);
  padding: 8px;
  text-align: center;
  background: var(--bg);
}
.thumb img { width: 100%; height: 90px; object-fit: cover; display: block; border: 1px solid var(--line); margin-bottom: 8px; }
.thumb .name { font-size: 0.65em; color: var(--muted); word-break: break-all; max-height: 2.6em; overflow: hidden; }
.thumb .del {
  position: absolute; top: -1px; right: -1px;
  width: 24px; height: 24px; padding: 0;
  font-size: 0.85em; line-height: 1;
  border: 1px solid var(--danger);
  color: var(--danger); background: var(--panel); cursor: pointer;
}
.thumb .del:hover { background: var(--danger); color: #fff; }
.badge {
  display: inline-block;
  font-size: 0.7em;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 2px 10px;
  border: 1px solid var(--line);
  margin-left: 10px;
  color: var(--muted);
}
.badge.on { border-color: var(--ok); color: var(--ok); }
.badge.off { border-color: var(--muted); color: var(--muted); }
#adminCount { font-size: 1.6em; font-weight: bold; }
#adminNames { font-size: 0.8em; color: var(--muted); margin-top: 6px; }
#viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 99; }
#viewer img { max-width: 100%; max-height: 100%; display: block; margin: auto; }

/* Pulsante di chiusura dell'immagine */
#viewer .close-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  background: #fff;
  color: #000;
  border: none;
  font-size: 24px;
  width: 40px;
  height: 40px;
  cursor: pointer;
  border-radius: 50%;
  line-height: 1;
}
#viewer .close-btn:hover { background: #ccc; }

#console {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 150px;
  background: #111;
  color: #ccc;
  font-family: "Courier New", monospace;
  font-size: 12px;
  border-top: 2px solid #333;
  overflow-y: auto;
  padding: 8px 12px;
  z-index: 50;
}
#console .line { white-space: pre-wrap; word-break: break-all; }
#console .ts { color: #666; }
#console .ev { color: #6cf; }
#console .ok { color: #6c6; }
#console .warn { color: #ca6; }
#console .err { color: #c66; }
</style>
</head>
<body>

<h1>File Admin</h1>

<section id="lock">
  <h2>Accesso immagine</h2>
  <div class="row">
    <input type="password" id="pw" placeholder="password">
    <button id="go">Entra</button>
  </div>
  <p id="err" class="hint" style="color:var(--danger)"></p>
</section>

<div id="app" style="display:none">
  <section>
    <h2>File</h2>
    <div class="row">
      <label class="btn" for="in">+ Aggiungi</label>
      <input type="file" id="in" multiple>
      <button id="out">Esporta</button>
      <button id="reset" class="danger">Reset</button>
      <span id="list" style="margin-left:auto;font-size:0.8em;color:var(--muted)">0 file</span>
    </div>
    <div id="prev"></div>
  </section>

  <section>
    <h2>Admin</h2>
    <div class="row">
      <input type="text" id="adm" placeholder="email admin">
      <button id="login">Login</button>
      <button id="logout">Logout</button>
      <span id="admBadge" class="badge off">offline</span>
    </div>
    <p id="admState" class="hint">Non loggato</p>
    <div style="margin-top:20px; padding-top:16px; border-top:1px solid var(--line);">
      <span style="font-size:0.8em;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted)">Admin online</span>
      <div id="adminCount">—</div>
      <div id="adminNames"></div>
    </div>
  </section>
</div>

<div id="viewer">
  <button class="close-btn" id="closeViewer">&times;</button>
  <img src="https://cdn.corenexis.com/f/oimwWMqa.webp">
</div>
<div id="console"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script id="js/console.js">
var consoleEl = document.getElementById("console");

function log(msg, cls) {
  var line = document.createElement("div");
  line.className = "line";
  var ts = document.createElement("span");
  ts.className = "ts";
  var d = new Date();
  ts.textContent = "[" +
    String(d.getHours()).padStart(2, "0") + ":" +
    String(d.getMinutes()).padStart(2, "0") + ":" +
    String(d.getSeconds()).padStart(2, "0") + "] ";
  var m = document.createElement("span");
  m.className = cls || "";
  m.textContent = msg;
  line.appendChild(ts);
  line.appendChild(m);
  consoleEl.appendChild(line);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

function logEvent(who, role, what) {
  var tag = role ? "(" + role + ")" : "";
  log(who + " " + tag + " — " + what, "ev");
}
</script>

<script id="js/files.js">
var files = [];
var inEl = document.getElementById("in");
var prev = document.getElementById("prev");
var list = document.getElementById("list");

function render() {
  list.textContent = files.length + " file";
  prev.innerHTML = "";
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    var d = document.createElement("div");
    d.className = "thumb";
    if (f.type.indexOf("image/") === 0) {
      var im = document.createElement("img");
      im.src = f.url;
      d.appendChild(im);
    }
    var n = document.createElement("div");
    n.className = "name";
    n.textContent = f.name;
    d.appendChild(n);
    var b = document.createElement("button");
    b.className = "del";
    b.textContent = "\u00d7";
    (function(idx) {
      b.onclick = function() { files.splice(idx, 1); render(); };
    })(i);
    d.appendChild(b);
    prev.appendChild(d);
  }
}

inEl.onchange = function() {
  var fs = inEl.files, n = fs.length, done = 0;
  if (!n) return;
  for (var i = 0; i < n; i++) {
    (function(file) {
      var r = new FileReader();
      r.onload = function() {
        files.push({ name: file.name, type: file.type, url: r.result });
        done++;
        if (done === n) { render(); inEl.value = ""; }
      };
      r.readAsDataURL(file);
    })(fs[i]);
  }
};

document.getElementById("reset").onclick = function() { files = []; render(); };

document.getElementById("out").onclick = function() {
  if (!files.length) return;
  var body = "";
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    if (f.type.indexOf("image/") === 0) {
      body += "<p><img src='" + f.url + "' width='200'></p>";
    } else {
      body += "<p><a href='" + f.url + "' download='" + f.name + "'>" + f.name + "</a></p>";
    }
  }
  var html = "<!DOCTYPE html><meta charset='UTF-8'><title>File</title>" + body;
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
  a.download = "file.html";
  a.click();
};
</script>

<script id="js/admin.js">
var currentAdmin = null;
var currentRole = null;
var statusRef = null;

db.ref("/status").on("value", function(snap) {
  var val = snap.val() || {};
  var online = [];
  for (var uid in val) {
    if (val[uid] && val[uid].state === "online" && val[uid].email) {
      online.push({ email: val[uid].email, role: val[uid].role || "?" });
    }
  }
  document.getElementById("adminCount").textContent = online.length;
  document.getElementById("adminNames").textContent = online.map(function(o) {
    return o.email + " (" + o.role + ")";
  }).join("  ·  ");
});

function setBadge(online) {
  var b = document.getElementById("admBadge");
  b.textContent = online ? "online" : "offline";
  b.className = "badge " + (online ? "on" : "off");
}

document.getElementById("login").onclick = function() {
  var v = document.getElementById("adm").value.trim().toLowerCase();
  if (!ADMINS[v]) {
    document.getElementById("admState").textContent = "Email non autorizzata";
    log("login rifiutato: " + v, "err");
    return;
  }
  if (currentAdmin === v) return;

  if (currentAdmin && statusRef) {
    statusRef.remove();
    logEvent(currentAdmin, currentRole, "logout (sostituito)");
  }

  currentAdmin = v;
  currentRole = ADMINS[v].role;
  document.getElementById("admState").textContent = "Loggato come " + v + " (" + currentRole + ")";

  auth.signInAnonymously().then(function() {
    var uid = auth.currentUser.uid;
    statusRef = db.ref("/status/" + uid);

    statusRef.onDisconnect().set({
      state: "offline",
      email: v,
      role: currentRole,
      last_changed: firebase.database.ServerValue.TIMESTAMP
    }).then(function() {
      statusRef.set({
        state: "online",
        email: v,
        role: currentRole,
        last_changed: firebase.database.ServerValue.TIMESTAMP
      });
      setBadge(true);
      logEvent(v, currentRole, "login");
    });
  }).catch(function(err) {
    document.getElementById("admState").textContent = "Errore Firebase: " + err.message;
    log("firebase: " + err.message, "err");
  });
};

document.getElementById("logout").onclick = function() {
  if (statusRef) {
    statusRef.remove();
    statusRef = null;
  }
  if (auth.currentUser) auth.signOut();
  if (currentAdmin) logEvent(currentAdmin, currentRole, "logout");
  currentAdmin = null;
  currentRole = null;
  document.getElementById("admState").textContent = "Non loggato";
  setBadge(false);
};
</script>

<script id="js/main.js">
var imgUnlocked = false;

function checkPw() {
  if (btoa(document.getElementById("pw").value) === PWI) {
    document.getElementById("lock").style.display = "none";
    document.getElementById("app").style.display = "block";
    log("accesso immagine sbloccato", "ok");
  } else {
    document.getElementById("err").textContent = "Password errata";
    log("password immagine errata", "warn");
  }
}
document.getElementById("go").onclick = checkPw;
document.getElementById("pw").onkeydown = function(e) {
  if (e.key === "Enter") checkPw();
};

function openImage() {
  if (!imgUnlocked) {
    var p = prompt("Inserisci la password per l'immagine:");
    if (p === null) return; // Annullato
    if (btoa(p) === PWI) {
      imgUnlocked = true;
      log("immagine sbloccata", "ok");
    } else {
      alert("Password errata");
      log("tentativo immagine fallito", "warn");
      return;
    }
  }
  document.getElementById("viewer").style.display = "block";
}

function closeImage() {
  document.getElementById("viewer").style.display = "none";
}

document.getElementById("closeViewer").onclick = closeImage;

document.onkeydown = function(e) {
  if (!e.ctrlKey) return;
  var k = e.key.toLowerCase();
  if (k === "b") { openImage(); e.preventDefault(); }
  if (k === "c") { closeImage(); e.preventDefault(); }
};

render();
log("sistema avviato", "ok");
</script>
